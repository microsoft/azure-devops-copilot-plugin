  <text x="365" y="212" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="16">AzureAuth</text>
  <rect x="526" y="86" width="378" height="308" rx="16" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
